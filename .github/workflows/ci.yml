name: CI

# A content repository: no service, no suite, no image. What CI owes it is the one check that
# guards the failure that cannot be undone — a committed secret is compromised the moment it
# lands, whatever kind of repository it lands in.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    with:
      require-dockerignore: false
    permissions:
      contents: read

  # The second failure a content repository can commit is an instruction to build something the
  # estate has retired. It costs a reader a day and is invisible to review, because the sentence
  # was true when it was written. See tools/check-dead-patterns.mjs for the two escapes.
  dead-patterns:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-dead-patterns.mjs
